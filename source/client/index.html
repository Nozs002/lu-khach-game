<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lữ Khách Game - Sảnh Chờ Pixel</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

    <!-- Màn hình Đăng nhập & Chọn nhân vật -->
    <div id="loginUI" class="pixel-box login-card">
        <h2>CHỌN LỮ KHÁCH</h2>
        
        <div id="character-list" class="char-list"></div>
        <div id="character-desc" class="char-desc-box"></div>

        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="playerName" placeholder="Nhập tên của bạn..." />
            <button id="joinBtn">VÀO GAME</button>
        </div>
    </div>

    <!-- Màn hình Game UI (Sảnh chờ) -->
    <div id="gameUI" style="display: none;">
        <div id="game-container">
            
            <!-- Thanh trạng thái Top bar -->
            <div class="top-bar">
                <div class="status-box">
                    Trạng thái: <span id="status" class="status-online">Đã kết nối</span>
                </div>
                <button id="startGameBtn" class="btn-start">VÀO GAME</button>
            </div>

            <!-- Thân chính (Canvas + Sidebar) -->
            <div class="main-body">
                <canvas id="gameCanvas" width="510" height="340"></canvas>
                
                <div class="sidebar">
                    <div class="pixel-box panel">
                        <h3>LỮ KHÁCH ONLINE</h3>
                        <ul id="players" class="player-list"></ul>
                    </div>
                    <div class="pixel-box panel">
                        <h3>NHẬT KÝ LÀNG</h3>
                        <div id="systemLog" class="log"></div>
                    </div>
                </div>
            </div>

            <!-- Hộp thoại Dialogue Box -->
            <div class="dialogue-box">
                <img src="/assets/characters/avatar.png" alt="Avatar" class="avatar" onerror="this.style.visibility='hidden'">
                <div class="dialogue-content">
                    <h3 id="dialogue-name" class="character-name">Hệ Thống</h3>
                    <p id="dialogue-text" class="dialogue-text">Bạn đang ở trong sảnh chờ. Nhấn nút 'VÀO GAME' để sẵn sàng!</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
